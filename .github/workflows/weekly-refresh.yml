# Weekly data refresh: fetch new Arbeitnow posts, rebuild the data and the search index,
# and upload them to the Hugging Face dataset. The online app loads the new data the next time
# it starts (after sleeping or a reboot).
# Needs two settings in the GitHub repo (Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN      a Hugging Face token that can WRITE to the dataset
#   variable HF_DATA_REPO  e.g. Amr-79/career-roadmap-data
name: Weekly data refresh

on:
  schedule:
    - cron: "17 3 * * 1"    # every Monday at 03:17 UTC
  workflow_dispatch:         # plus a "Run workflow" button in the Actions tab

permissions:
  contents: read             # it only reads the code; the data goes to Hugging Face

concurrency:
  group: weekly-refresh      # never two refreshes at the same time
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATA_REPO: ${{ vars.HF_DATA_REPO }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install packages
        run: pip install -r requirements-pipeline.txt

      - name: Download the current data from Hugging Face
        run: python hf_data.py download --all

      - name: Fetch this week's Arbeitnow posts
        run: python fetch_arbeitnow.py

      - name: Run the pipeline (filter, merge, clean, extract skills)
        run: python run_pipeline.py

      - name: Embed the new chunks
        run: python build_index.py

      - name: Sync the index with the data
        run: python sync_index.py

      - name: Upload the new data to Hugging Face
        run: python hf_data.py upload
